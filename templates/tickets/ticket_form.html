{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Новая заявка — Helpdesk{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1>Новая заявка</h1>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Создать заявку</button>
            </div>
        </form>
    </div>
{% endblock %}
