{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Смена статуса — Helpdesk{% endblock %}

{% block content %}
    <a href="{% url 'tickets:ticket_detail' ticket.pk %}" class="back-link">&laquo; К заявке</a>

    <div class="card form-card">
        <h1>Смена статуса заявки</h1>
        <p class="form-subtitle">«{{ ticket.title }}»</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
{% endblock %}
