{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Регистрация — Helpdesk{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1>Регистрация</h1>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </div>
        </form>
        <p class="form-footer">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войдите</a></p>
    </div>
{% endblock %}
