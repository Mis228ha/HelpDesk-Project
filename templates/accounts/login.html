{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Вход — Helpdesk{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1>Вход</h1>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Войти</button>
            </div>
        </form>
        <p class="form-footer">Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрируйтесь</a></p>
    </div>
{% endblock %}
