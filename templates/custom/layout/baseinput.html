{% load crispy_forms_field %}<input type="{{ input.input_type }}"
       name="{% if input.name|wordcount > 1 %}{{ input.name|slugify }}{% else %}{{ input.name }}{% endif %}"
       value="{{ input.value }}"
       {% if input.input_type != "hidden" %}
       class="btn {% if input.input_type == 'submit' %}btn-primary{% else %}btn-secondary{% endif %}{% if input.field_classes %} {{ input.field_classes }}{% endif %}"
       id="{% if input.id %}{{ input.id }}{% else %}{{ input.input_type }}-id-{{ input.name|slugify }}{% endif %}"
       {% endif %}
       {{ input.flat_attrs|safe }}
       />
