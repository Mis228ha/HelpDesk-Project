{% if form.non_field_errors %}
    <div class="form-errors">
        {% if form_error_title %}<h3>{{ form_error_title }}</h3>{% endif %}
        <ul class="error-list">
            {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
