services:
  postgres:
    image: postgres:16
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Задайте DB_NAME в .env}
      POSTGRES_USER: ${DB_USER:?Задайте DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: